[package]
name = "nanobug"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native character-grid editor with an embedded Neovim core"

[dependencies]
anyhow = "1"
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", default-features = false }
image = { version = "0.25.10", default-features = false }
unicode-script = "0.5"
unicode-segmentation = "1.12"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27.0"
toml = "0.8.23"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
debug = 0
strip = true

[workspace]
