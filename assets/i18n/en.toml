[keyboard]
choose = "Select a highlighted key\nPress a key or click its cap to inspect it. Tap and release Ctrl, Alt or Shift to switch views."
ctrl = "Inspect Ctrl combinations\nPress a highlighted key by itself. Tap Ctrl again to deselect, or tap Alt to see Ctrl+Alt bindings."
alt = "Inspect Alt combinations\nPress a highlighted key by itself. Tap Alt again to deselect, or tap Ctrl to see Ctrl+Alt bindings."
ctrl_alt = "Inspect Ctrl+Alt combinations\nPress a highlighted key by itself. Tap Ctrl or Alt again to deselect that modifier."
shift = "Inspect Shift combinations\nPress a highlighted key by itself to inspect its shifted binding. Tap Shift again or click its cap to deselect."
example = "Example"
insert_key = "Enter Insert mode or switch between Insert and Replace\nIn Normal mode, start inserting at the cursor. In Insert or Replace mode, switch between them.\nAt the start of cat, press Ins, type X, press Ins, type Y, then Esc. The line becomes XYat."
previous_tab = "Switch to the previous tab\nSelect the tab to the left while keeping each tab's document and cursor state.\nOn the second tab, hold Alt and press h or k to select the first tab."
next_tab = "Switch to the next tab\nSelect the tab to the right while keeping each tab's document and cursor state.\nOn the first of two tabs, hold Alt and press j or l to select the second tab."
move_tab_left = "Move the current tab one place left\nMove the selected tab one position to the left and keep it selected.\nWith the second tab selected, hold Ctrl and Alt and press h or k to move it first."
move_tab_right = "Move the current tab one place right\nMove the selected tab one position to the right and keep it selected.\nWith the first tab selected, hold Ctrl and Alt and press j or l to move it to second."
tab_to_first = "Move the current tab to the front\nMove the selected tab to the first position in the tab bar.\nHold Ctrl and Alt and press Home to move the current tab to the front."
tab_to_last = "Move the current tab to the end\nMove the selected tab to the last position in the tab bar.\nHold Ctrl and Alt and press End to move the current tab to the end."
close_editor = "Close the editor pane\nClose the editor pane or its standalone tab. Unsaved changes prompt for confirmation.\nWith Explorer visible, hold Alt and press Esc to close the editor and focus Explorer."
escape = "Close shortcut help\nReturn to the pane that opened this window.\nWhile the popup is open, press Esc to return to that pane."
refresh = "Refresh Explorer\nRescan the project directory so Explorer reflects changes on disk.\nAfter creating a file in the project, press F5 to show it in Explorer."
cycle_cursor = "Select the next cursor effect\nCycle through the available cursor animation presets.\nPress F6 in the editor to switch to the next effect."
cycle_cursor_back = "Select the previous cursor effect\nCycle through the cursor animation presets in reverse.\nHold Shift and press F6 to select the previous effect."
reload_cursor = "Reload the cursor configuration\nRead the current project's cursor settings and report the result in the status bar.\nAfter saving a change to the project's cursor configuration, press F7 to apply it."
delete_key = "Delete the character at the cursor\nDelete the current character in Normal mode or the next character in Insert mode.\nPut the Normal-mode cursor on the c in cat and press Delete. The line becomes at."
backspace = "Delete to the left or move left\nIn Insert mode, delete the previous character. In Normal mode, move left.\nOn a blank line, press i, type ab, and press Backspace then Esc. The line contains a."
home = "Go to the start of the line\nMove to the first column of the current line, including indentation.\nWhile on an indented line, press Home to reach column 1."
end = "Go to the end of the line\nMove the Normal-mode cursor to the last character of the current line.\nFrom the middle of cat, press End to land on t."
tab = "Go forward in jump history or insert a tab\nIn Normal mode, move forward in the jump list. In Insert mode, insert a tab character.\nPress G, then Ctrl+o to go back. Press Tab to return to the jump at the last line."
page_up_key = "Page up\nScroll the editor up by a page, with two lines of overlap when there is room.\nPress PageUp while viewing the middle of a long file to see the previous page."
page_down_key = "Page down\nScroll the editor down by a page, with two lines of overlap when there is room.\nPress PageDown while viewing the middle of a long file to see the next page."
enter = "Open a fold, go to the next line, or insert a line break\nNormal: open a fold or go to the next line's first nonblank. Insert: add a line break.\nOn a folded line, Enter opens one level and keeps the cursor in place."
arrow_up = "Move up one line\nMove up, keeping the display column where possible. A count moves farther.\nPress 2, then ↑ to move up two lines."
arrow_down = "Move down one line\nMove down, keeping the display column where possible. A count moves farther.\nPress 2, then ↓ to move down two lines."
arrow_left = "Move left one character\nMove left within the line. A count moves farther, up to the start of the line.\nPress 2, then ← to move two characters left on this line."
arrow_right = "Move right one character\nMove right within the line. A count moves farther, up to the end of the line.\nPress 2, then → to move two characters right on this line."
split_grow_height = "Increase the current split's height by 2 rows\nAdjust the height in Normal mode when the divider has room to move.\nClose help and press Ctrl+↑ in a stacked split to make it taller."
split_shrink_height = "Decrease the current split's height by 2 rows\nAdjust the height in Normal mode down to the split's minimum.\nClose help and press Ctrl+↓ in a stacked split to make it shorter."
split_shrink_width = "Decrease the current split's width by 2 columns\nIn the help popup, holding Ctrl and pressing ← returns to editor shortcuts.\nClose help and press Ctrl+← in Normal mode to make the split narrower."
split_grow_width = "Increase the current split's width by 2 columns\nIn the help popup, holding Ctrl and pressing → opens global shortcuts.\nClose help and press Ctrl+→ in Normal mode to make the split wider."
left = "Move left\nMove left one character within the line. Put a count first to move farther. In Visual mode, move the selection endpoint.\nPress 3, then h to move three characters left on this line."
down = "Move down\nMove down one line, keeping the display column where possible. Put a count before j to move multiple lines.\nPress 2, then j to move down two lines, keeping the column if possible."
up = "Move up\nMove up one line, keeping the display column where possible. Put a count before k to move multiple lines.\nPress 5, then k to move up five lines, keeping the column if possible."
right = "Move right\nMove right one character within the line. Put a count first to move farther. In Visual mode, move the selection endpoint.\nPress 3, then l to move three characters right on this line."
word_next = "Go to the next word start\nMove to the next word or punctuation run. Use a count or follow d, c, or y to mark an edit range.\nFrom the start of red green blue gray, land at the start of gray."
word_prev = "Go to the previous word start\nMove back to the start of the current word. At its start, go to the previous word. A count repeats the move.\nFrom the start of blue in red green blue, jump to the start of red."
word_end = "Go to the end of a word\nMove to the end of this word or the next one if already at an end. A count goes farther. Operators include the endpoint.\nFrom the start of red green, land on the n at the end of green."
line_start = "Go to the start of the line\nMove to the first display column of the current line, including indentation. Use ^ to skip the leading whitespace.\nOn an indented line, press 0 to land in the first column."
line_text = "Go to the first nonblank character\nSkip leading spaces and tabs to reach the first nonblank character. On an empty line, stay at its start.\nOn a line starting with spaces, press ^ to land on its first nonblank."
line_end = "Go to the end of the line\nMove to the last character of the line. A count includes subsequent lines. Use d$ to delete through the end.\nPress 2, then $ to land at the end of the next line."
g_prefix = "Start a g command\nWait for the next key. Press g again to reach the first line, or put a line number before gg.\nPress g twice to jump to the first line of the file."
first_line = "Go to the first or specified line\nPress gg for the first line, or put a line number before it. Keep the display column where possible.\nPress 3, then g twice to jump straight to line 3."
last_line = "Go to the last or specified line\nPress G for the last line, or put a line number before it. Keep the display column where possible.\nPress 3, then uppercase G to jump straight to line 3."
insert = "Insert at the cursor\nType before the cursor. A Normal count repeats the text on Esc. In Visual mode, iw selects the inside of a word.\nPress 2, then i. Type hi and press Esc to insert hihi before the cursor."
append = "Insert after the cursor\nType after the cursor. A Normal count repeats the text on Esc. In Visual mode, aw includes the word and nearby space.\nPress 2, then a. Type hi and press Esc to insert hihi after the cursor."
insert_start = "Insert at the first nonblank\nType after indentation. A Normal count repeats input on Esc. In block selection, insert at the left of each row.\nPress uppercase I, type hi, and press Esc. The text goes after indentation."
append_end = "Insert at the end of the line\nType at line end. A Normal count repeats input on Esc. In block selection, append at the right of each row.\nPress uppercase A, type hi, and press Esc. The text goes at the line end."
open_below = "Open below or swap selection ends\nOpen a line below. A Normal count repeats the line and input on Esc. In Visual mode, switch selection endpoints.\nPress 2, then o. Type hi and press Esc to add two lines of hi below."
open_above = "Open above or move the active end\nOpen a line above. A Normal count repeats the line and input on Esc. In block selection, switch the active side.\nPress 2, then uppercase O. Type hi and press Esc to add two lines above."
delete = "Delete at the cursor\nDelete characters from the cursor to the line end at most. A count sets how many. In Visual mode, delete the selection.\nOn the a in abcde, press 3 then x. The line becomes de."
delete_before = "Delete before the cursor\nDelete the character just before the cursor. A count deletes more characters, stopping at the start of the line.\nOn the d in abcde, press 2 then uppercase X. The line becomes ade."
substitute_char = "Change characters at the cursor\nDelete from the cursor and enter Insert mode. A count sets how many characters. In Visual mode, change the selection.\nAt the start of bad, press 2 then s. Type ok and press Esc to get okd."
substitute_line = "Change the current line\nLike cc, keep the starting indentation, remove the line's content, and start Insert. A count covers more lines.\nPress 2 then uppercase S. Type ok and press Esc to replace two lines with one."
delete_end = "Delete to the end of the line\nDelete from the cursor through the line end and store the text in a register. A count extends to later lines.\nDelete from the cursor through the end of the next line."
change_end = "Change to the end of the line\nDelete to the line end and start typing. A count extends to a later line end. Press Esc to finish editing.\nReplace text through the end of the next line with ok. Esc finishes the edit."
yank_end = "Yank to the end of the line\nYank from the cursor through the line end. A count extends to a later line end. Use p or P to paste the text.\nCopy from the cursor through the end of the next line. Use p to put the copy."
delete_range = "Delete a motion range or selection\nFollow d with a motion or text object. Use a count to extend the range. In Visual mode, delete the selection.\nAt the start of red green blue, delete through the space before blue."
change_range = "Change a motion range or selection\nFollow c with a motion or text object, using a count to extend it. Delete that range and enter Insert mode.\nOn any letter in cat, press c, i, w. Type dog and press Esc to replace cat."
yank_range = "Yank a motion range or selection\nFollow y with a motion or text object. A count extends the range. In Visual mode, yank the selection.\nFrom the start of red green blue, copy red green and the space before blue."
delete_line = "Delete whole lines\nDelete the current line into a linewise register. A count includes lines below it. Use p to put the lines back.\nPress 2 and then d twice to delete the current line and the one below."
change_line = "Change whole lines\nKeep the starting indentation, remove the line's text, and start Insert. A count replaces multiple lines together.\nPress c twice. Type ok and press Esc to replace the current line after its indent."
yank_line = "Yank whole lines\nCopy the current line into a linewise register. A count copies more lines. Use p to paste below the current line.\nPress 2 and then y twice to copy the current line and the one below."
delete_word = "Delete up to the next word\nDelete up to the next word start. A count covers more words. If the final word reaches line end, stop there.\nAt the start of red green blue, delete through the space before blue."
change_word = "Change the rest of the current word\nChange from the cursor through the word end. A count includes more words. Use ciw to change the whole word.\nFrom the start of red green blue, replace red green with ok, leaving ok blue."
yank_word = "Yank up to the next word\nYank up to the next word start, possibly including whitespace. Use a count for more words, or yiw for a whole word.\nFrom the start of red green blue, copy red green and the space before blue."
inner_word = "Change the whole word at the cursor\nChange the whole word at the cursor. A count includes each intervening run of spaces as one item.\nWithin alpha in alpha beta, press 2, c, i, w, type X, then Esc. The result is Xbeta."
delete_inner_word = "Delete the whole word at the cursor\nDelete the whole word. With a count, each run of spaces between words counts as one item.\nOn the e in red blue, press d, i, w to delete red and leave the space."
yank_inner_word = "Yank the whole word at the cursor\nCopy the word to a register. With a count, each run of spaces between words counts as one item.\nOn the e in red blue, press y, i, w to copy red into the register."
paste_after = "Put register text after the cursor\nCharacter text goes after the cursor. Whole lines go below the current line. A count repeats the put.\nCopy the line with yy, move down with j, then paste below that line with p."
paste_before = "Put register text before the cursor\nCharacter text goes before the cursor. Whole lines go above the current line. A count repeats the put.\nCopy the line with yy, move down with j, then paste above it with uppercase P."
visual = "Start character selection\nAnchor a selection at the cursor, then extend it with motions. Use d, c, or y to operate on the selection.\nPress v, then l to select the character under the cursor and the next one."
visual_line = "Start line selection\nSelect the whole current line. Use j or k to extend or shrink the selection. d, c, and y operate on whole lines.\nPress uppercase V, then j to select the current line and the next line."
undo = "Undo a change or lowercase selection\nIn Normal mode, undo the last text change. A count undoes multiple steps. In Visual mode, lowercase the selection.\nAfter making two edits, press 2 then u to undo both in order."
undo_line = "Restore the last edited line\nIn Normal mode, restore the last edited line. Repeat U to toggle it back. In Visual mode, uppercase the selection.\nDelete a character with x, then press uppercase U to restore the line."
join = "Join with the next line\nJoin at least two lines, dropping later indentation and adding space as needed. A count sets the total.\nPress 3, then uppercase J to combine the current line and the next two."
search = "Search forward for a pattern\nType a pattern and press Enter to search after the cursor. Put a count before / to choose which match to reach.\nPress 2 then /, type word, and press Enter to reach the second forward match."
search_back = "Search backward for a pattern\nType a pattern and press Enter to search before the cursor. Put a count before ? to choose which match to reach.\nPress 2 then ?, type word, and press Enter to reach the second backward match."
search_repeat = "Repeat the search in the same direction\nRepeat the last search in its original direction. Put a count before n to choose which match to reach.\nAfter a search, press 2 then n to reach the second match in that direction."
search_reverse = "Repeat the search in reverse\nReverse the direction of the last search. Put a count before N to choose which match to reach.\nAfter searching forward, press 2 then uppercase N for the second match backward."
command = "Open the editor command line\nType an Ex command and press Enter. Use :w to save, :e with a filename to open it, or :s to substitute text.\nPress :, type %s/old/new/g, and press Enter to replace every old with new."
repeat_change = "Repeat the last text change\nRepeat the last change at the cursor. A count before . replaces the count used by that change.\nDelete one character with x. Press 2 then . to delete two more at the cursor."
record = "Record or stop a macro\nPress q and a letter, then perform the edits to record. Press q again to stop. Replay with @ and the letter.\nPress q then a to start recording. Delete with x and press q to store it in a."
play = "Play a macro from a register\nPress @ and the register letter. A count repeats playback. Use @@ to run the most recently played macro.\nWith a macro in register a, press 2 then @ and a to run it twice."
play_last = "Play the last recorded macro\nRun the last macro you finished recording without entering its register letter. A count repeats playback.\nAfter recording a macro, press 2 then uppercase Q to run it twice."
mark = "Set a named mark at the cursor\nPress m and a letter to remember the cursor position. Return with an apostrophe or a backtick and the letter.\nPress m then a to save the cursor's current line and column as mark a."
mark_line = "Go to the marked line\nPress the apostrophe and mark letter to move to the first nonblank of that line. Use ma to set mark a.\nAfter setting mark a with ma, press ' then a to jump to that line's text start."
mark_exact = "Go to the exact mark position\nPress the backtick and mark letter to return to the exact line and column saved by the mark.\nAfter setting mark a with ma, press backtick then a to return to its exact cell."
replace = "Replace with the next character\nPress r and type the replacement. A count replaces multiple characters. In Visual mode, replace the selection.\nAt the start of abcde, press 2, r, then x. The line becomes xxcde."
replace_mode = "Enter Replace mode\nOverwrite characters as you type and append at line end. A count repeats the replacement input on Esc.\nAt the start of abcd, press R, type xy, and press Esc. The line becomes xycd."
find = "Find a character to the right\nPress f and the target character. Land on the match in this line. A count selects an occurrence.\nPress 2, f, then a to land on the second a to the right on this line."
find_left = "Find a character to the left\nPress F and the target character. Search left on this line and land on the match. A count chooses an occurrence.\nPress 2, uppercase F, then a to land on the second a to the left."
till = "Move just before a character on the right\nPress t and a character to stop before the match on this line. A count chooses the occurrence. d or c keeps the match.\nPress 2, t, then comma to stop just before the second comma on the right."
till_left = "Move just after a character on the left\nPress T and a character. Search left on this line and stop just after the match. A count chooses an occurrence.\nPress 2, uppercase T, then comma to stop just after the second comma on the left."
find_repeat = "Repeat the last character search\nRepeat the last f, F, t, or T with the same stopping rule. A count chooses which occurrence to reach.\nFind the first a with fa, then press 2 and ; to reach the second a after it."
find_reverse = "Reverse the last character search\nRepeat the last character search in reverse within this line. A count chooses which occurrence to reach.\nOn X in aXa, fa jumps to the right a. Press comma to jump to the left a."
match_pair = "Jump to a matching bracket or percentage\nFind a bracket at or after the cursor on this line and jump to its match. With 1–100, jump by file percentage.\nPress 5, 0, then % to jump to the line halfway through the file."
word_search = "Search forward for the word at the cursor\nSearch forward for the whole word at the cursor. A count chooses which match to reach. Use n to continue.\nOn cat, press 2 then * to find the second whole-word cat after the cursor."
word_search_back = "Search backward for the word at the cursor\nSearch backward for the whole word at the cursor. A count chooses which match to reach. Use n to continue.\nOn cat, press 2 then # to find the second whole-word cat before the cursor."
sentence_prev = "Go to the previous sentence start\nMove backward to a sentence start using sentence-ending punctuation and whitespace. A count repeats the jump.\nFrom inside a sentence, press ( to return to its start."
sentence_next = "Go to the next sentence start\nMove forward to a sentence start using sentence-ending punctuation and whitespace. A count repeats the jump.\nFrom inside a sentence, press ) to move to the start of the next sentence."
paragraph_prev = "Go to the previous paragraph boundary\nMove backward to a paragraph boundary marked by a blank line. A count crosses multiple boundaries.\nFrom inside a paragraph, jump backward to the blank line before it."
paragraph_next = "Go to the next paragraph boundary\nMove forward to a paragraph boundary marked by a blank line. A count crosses multiple boundaries.\nFrom inside a paragraph, jump forward to the blank line after it."
outdent = "Reduce indentation on the affected lines\nUse a motion or << for this line. A count before << includes more lines. In Visual mode, shift the selection left.\nPress 2, then < twice to reduce indentation on this line and the next."
indent = "Increase indentation on the affected lines\nUse a motion or >> for this line. A count before >> includes more lines. In Visual mode, shift the selection right.\nPress 2, then > twice to increase indentation on this line and the next."
reindent = "Reindent the affected lines\nAdjust indentation using nearby lines and brackets. Follow with a motion or text object, or use 2== for two lines.\nPress =, i, p to recalculate indentation for the current paragraph."
line_up = "Go to the previous line's first nonblank\nMove up one line and skip its indentation. A count sets how many lines to move upward.\nPress 2 then - to land at the first nonblank two lines above."
line_down = "Go to the next line's first nonblank\nMove down one line and skip its indentation. A count sets how many lines to move downward.\nPress 2 then + to land at the first nonblank two lines below."
line_count = "Go to the first nonblank of a counted line\nWith no count, skip this line's indentation. Counting starts at the current line, so 3_ moves two lines down.\nPress 3 then _. Counting this line first, land two lines below at its text start."
column = "Go to a display column\nUse a 1-based display column, accounting for tabs and wide characters. With no count, go to column 1.\nPress 1, 2, then | to go to display column 12 on the current line."
toggle_case = "Toggle letter case\nFlip the case of characters from the cursor and advance. A count sets how many. In Visual mode, flip the selection.\nAt the start of aBc, press 3 then ~ to change it to AbC."
repeat_substitution = "Repeat the last substitution\nReuse the last :s pattern, replacement, and flags on the current line. Move to the target line first.\nReplace old with new on this line. Press j then & to do the same on the next."
shell_filter = "Filter lines through a shell command\nUse a motion or !! to choose lines. A count before !! includes more lines. Enter a command to replace them with output.\nPress 2, !, !, type sort, and press Enter to sort this line and the next."
register = "Choose a register for the next edit\nPress the double quote and a register name before a yank, delete, or put. Named registers store separate text.\nPress double quote, a, then y twice to copy the current line into register a."
bracket_left = "Start a backward bracket command\nFollow [ with m to look for an earlier method or block boundary. A count can cross multiple boundaries.\nFrom inside a method, press [ then m to find an earlier method or block boundary."
bracket_right = "Start a forward bracket command\nFollow ] with m to look for a later method or block boundary. A count can cross multiple boundaries.\nFrom inside a method, press ] then m to find a later method or block boundary."
method_prev = "Go to an earlier method or block\nSearch backward for a method or block boundary using brace nesting. A count crosses multiple boundaries.\nPress 2, [, m to jump to the second earlier method or block boundary."
method_next = "Go to a later method or block\nSearch forward for a method or block boundary using brace nesting. A count crosses multiple boundaries.\nPress 2, ], m to jump to the second later method or block boundary."
z_prefix = "Fold, scroll, check spelling or use a register\nPress z to see the next keys. Use zf to fold text, or z= to check spelling.\nPress z twice to center the cursor line."
view_center = "Center the current or specified line\nScroll to place the cursor line near the middle. A line number first moves the cursor to that line.\nPress 1, 2, then z twice to go to line 12 and center it in the viewport."
view_top = "Place the line near the top\nScroll the cursor line to the top margin. With a line number, move to that line first.\nPress 1, 2, z, t to go to line 12 and place it near the top."
view_bottom = "Place the line near the bottom\nScroll the cursor line to the bottom margin. With a line number, move to that line first.\nPress 1, 2, z, b to go to line 12 and place it near the bottom."
leader = "Start a Nanobug Leader command\nPress backslash or Space in Normal mode. Pause for the Key Sequence Hint.\nClose help, then press backslash or Space followed by ? to reopen it."
big_word_prev = "Go to the previous whitespace-delimited word\nMove to the start of a nonblank run, including punctuation. Put a count before B to move back across more runs.\nFrom the start of end in foo-bar baz.qux end, move back to foo-bar."
big_word_next = "Go to the next whitespace-delimited word\nSkip the current run of nonblank characters and its following space. A count repeats the move.\nFrom the start of foo-bar baz.qux end, move forward to end."
big_word_end = "Go to a whitespace-delimited word end\nLand at the end of a nonblank run, including punctuation. A count before E reaches farther runs.\nFrom the start of foo-bar baz.qux, land on the x at the end of baz.qux."
screen_top = "Move to a line near the top of the viewport\nMove the cursor toward the top of the visible area, respecting scroll margins. A count offsets the target inward.\nPress 5 then uppercase H to move toward the fifth line from the viewport top."
screen_middle = "Move to the middle visible line\nMove the cursor to the middle of the visible lines, using the current viewport as the reference.\nPress uppercase M to move the cursor to the middle visible line."
screen_bottom = "Move to a line near the bottom of the viewport\nMove the cursor toward the bottom of the visible area, respecting scroll margins. A count offsets the target.\nPress 5 then uppercase L to move toward the fifth line from the viewport bottom."
z_capital = "Choose how to exit\nPress Z again to save the current file before quitting, or press Q to quit and discard unsaved changes.\nPress uppercase Z twice to save the active file and request to quit."
save_exit = "Save the current file and quit\nSave the active file if it changed, then request to quit. Other modified files follow Nanobug's quit confirmation.\nPress uppercase Z twice to write changes in the active file and request to quit."
discard_exit = "Quit and discard unsaved changes\nQuit Nanobug immediately. Edits in this window that have not been saved to disk are discarded.\nPress uppercase Z then Q to quit and discard unsaved edits."
save = "Save the current file\nWrite the active document to disk. Use :w to save, or add a filename after :w to save to another path.\nHold Ctrl and press s to write the current document to disk."
redo = "Redo or insert register text\nIn Normal mode, redo one change or use a count for more. In text entry, follow with a register name to insert it.\nAfter two undos, press 2, then hold Ctrl and press r to redo both changes."
control_w = "Delete the word before the cursor\nIn Insert mode, delete the previous word as a separate undo step. In prompts, delete the word before the caret.\nOn a blank line, type red blue in Insert mode. Ctrl+w erases blue. Esc finishes."
control_u = "Scroll up half a page or clear input\nIn Normal mode, a count sets the half-page size. In Insert mode, clear recent typing. In prompts, clear to the start.\nPress 5 then Ctrl+u to scroll up five lines and set the half-page size to five."
half_down = "Scroll down half a page\nMove the viewport and cursor down together. A count sets the distance for later Ctrl+d and Ctrl+u commands.\nPress 5 then Ctrl+d to scroll down five lines and set the half-page size to five."
block = "Select a block or paste the clipboard\nIn Normal mode, select a rectangle of rows and columns. In a Nanobug text field, paste the system clipboard.\nHold Ctrl and press v, then press j and l to select a two-by-two block."
normal = "Return to Normal mode\nWorks like Esc. Leave Insert, Replace, Visual, or a command prompt and cancel a pending command.\nPress i and type hi. Hold Ctrl and press [ to finish inserting and return to Normal."
pane_left = "Focus the left pane or show local shortcuts\nIn Normal mode, focus Explorer. In shortcut help, show the current area's keys. In Insert mode, act as Backspace.\nIn Normal mode, hold Ctrl and press h to move focus from the editor to Explorer."
pane_right = "Focus the right pane or show global shortcuts\nFrom Explorer, focus the editor and restore its pane if hidden. In shortcut help, switch to global shortcuts.\nIn shortcut help, hold Ctrl and press l to switch to the Global shortcuts tab."
pane_down = "Focus a lower pane\nIn Normal mode, this is for a lower pane. If there is none, focus stays put. In Insert mode, it starts a new line.\nPress i, then Ctrl+j to insert a line break. Press Esc to return to Normal."
pane_up = "Focus an upper pane\nIn Normal mode, this is for an upper pane. If the current layout has none, focus stays where it is.\nHold Ctrl and press k in Normal mode. In a side-by-side layout, focus stays put."
increment = "Increment a number at or after the cursor\nFind the first number at or after the cursor on this line. Add 1 by default, or use a count as the amount.\nOn the decimal number 7, press 3 then Ctrl+a to change it to 10."
decrement = "Decrement a number at or after the cursor\nFind the first number at or after the cursor on this line. Subtract 1 by default, or use a count as the amount.\nOn the decimal number 7, press 3 then Ctrl+x to change it to 4."
page_up = "Scroll up one page\nIn Normal mode, scroll up a page with two lines of overlap. Use a count to scroll multiple pages.\nPress 2 then Ctrl+b to page up twice, with two lines of overlap per page."
page_down = "Scroll down one page\nIn Normal mode, scroll down a page with two lines of overlap. Use a count to scroll multiple pages.\nPress 2 then Ctrl+f to page down twice, with two lines of overlap per page."
scroll_down = "Scroll the viewport down\nScroll down one line by default. A count sets the distance. Move the cursor only to respect scroll margins.\nPress 2 then Ctrl+e to reveal two more lines at the bottom of the viewport."
scroll_up = "Scroll the viewport up\nScroll up one line by default. A count sets the distance. Move the cursor only to respect scroll margins.\nPress 2 then Ctrl+y to reveal two more lines at the top of the viewport."
jump_back = "Go back in the jump list\nReturn to an earlier jump location, such as where you were before a search. A count goes back more entries.\nJump to the last line with G, then press Ctrl+o to return to the previous location."
jump_forward = "Go forward in the jump list\nAfter going back with Ctrl+o, move toward a newer jump location. A count goes forward more entries.\nUse G, then Ctrl+o to go back. Ctrl+i returns to the location at the last line."

