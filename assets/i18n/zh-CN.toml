home = "跳到行首\n光标移到本行第一列，包括行首缩进。\n在缩进后的正文处按 Home，光标回到本行第一列。"
end = "跳到行尾\n普通模式下，把光标移到本行最后一个字符。\n光标在 cat 的 a 上时按 End，光标停在 t 上。"
tab = "前进到较新的跳转位置或插入制表符\n普通模式沿跳转记录前进，插入模式输入制表符。\n按 G 跳到末行，再按 Ctrl+o 返回。按 Tab 回到末行的跳转位置。"
page_up_key = "向上翻页\n编辑区向上翻一页，空间足够时保留两行重叠。\n在长文件中间按 PageUp，查看前一页。"
page_down_key = "向下翻页\n编辑区向下翻一页，空间足够时保留两行重叠。\n在长文件中间按 PageDown，查看后一页。"
enter = "展开折叠、跳到下一行或插入换行\n普通模式下展开折叠或跳到下一行首个非空白字符。插入模式下换行。\n光标停在折叠行时，按 Enter 原地展开一层。"
arrow_up = "向上移动一行\n向上移动并尽量保持原显示列，前加数字可移动多行。\n先按 2，再按 ↑，光标向上移动两行。"
arrow_down = "向下移动一行\n向下移动并尽量保持原显示列，前加数字可移动多行。\n先按 2，再按 ↓，光标向下移动两行。"
arrow_left = "向左移动一个字符\n在本行向左移动，前加数字可多移几个字符，最远到行首。\n先按 2，再按 ←，在本行向左移动两个字符。"
arrow_right = "向右移动一个字符\n在本行向右移动，前加数字可多移几个字符，最远到行尾。\n先按 2，再按 →，在本行向右移动两个字符。"
area_shortcuts = "查看当前区域快捷键\n切回快捷键弹层中当前窗格的面板。\n在全局快捷键页按住 Ctrl 再按 ←，切回编辑区快捷键。"
global_shortcuts = "查看全局快捷键\n切到快捷键弹层的全局快捷键面板。\n在编辑区快捷键页按住 Ctrl 再按 →，查看全局快捷键。"
left = "向左移动\n在本行向左移一个字符。前加数字可多移几格，最远到行首。可视模式下移动选区端点。\n先按 3，再按 h，在本行向左移动三个字符。"
down = "向下移动\n向下移一行，尽量保持当前显示列。前加数字可移动多行，可视模式下用来调整选区。\n先按 2，再按 j，光标下移两行，尽量保持原列。"
up = "向上移动\n向上移一行，尽量保持当前显示列。前加数字可移动多行，可视模式下用来调整选区。\n先按 5，再按 k，光标上移五行，尽量保持原列。"
right = "向右移动\n在本行向右移一个字符。前加数字可多移几格，最远到行尾。可视模式下移动选区端点。\n先按 3，再按 l，在本行向右移动三个字符。"
word_next = "跳到下一词开头\n向前移到下一段词字符或标点的开头。可加次数，也可接在 d、c 或 y 后指定范围。\n从 red green blue gray 的开头出发，跳到 gray 的词首。"
word_prev = "跳到上一词开头\n向后移到当前词的开头。已在词首时跳到上一词，数字可继续向后跳过多个词。\n光标在 red green blue 的 blue 词首时，跳回 red 的词首。"
word_end = "跳到词尾\n移到当前词尾，已在词尾时去下一词尾。前加数字可跨多个词，配合操作符时包含目标字符。\n从 red green 的开头出发，停在 green 的末尾字符 n 上。"
line_start = "跳到行首\n移到当前行的第一个显示列，包括缩进。要跳过缩进，可以按 ^。\n在有缩进的行上按 0，光标移到最左边的第一列。"
line_text = "跳到本行文字开头\n跳过行首的空格和制表符，停在第一个非空白字符。空行则停在行首。\n在有缩进的行上按 ^，光标跳过行首空白，停在正文开头。"
line_end = "跳到行尾\n移到本行最后一个字符。前加数字可到后面一行的行尾，d$ 可从光标处删到行尾。\n先按 2，再按 $，光标跳到下一行的末尾。"
g_prefix = "开始 g 系列命令\n等待下一键。接 g 跳到首行，前加数字再按 gg 可跳到指定行。\n连续按两次 g，光标跳到文件首行。"
first_line = "跳到首行或指定行\n直接按 gg 跳到首行，前加数字跳到该行。尽量保持原来的显示列。\n先按 3，再连续按两次 g，跳到文件第 3 行。"
last_line = "跳到末行或指定行\n直接按 G 跳到末行，前加数字跳到该行。尽量保持原来的显示列。\n先按 3，再按大写 G，跳到文件第 3 行。"
insert = "在光标处插入\n普通模式下从光标前开始输入，前加数字会在 Esc 时重复输入内容。可视模式下 iw 选择词内部。\n先按 2、i，输入 hi 后按 Esc，光标前会插入 hihi。"
append = "在光标后插入\n普通模式下从光标后开始输入，前加数字会在 Esc 时重复输入内容。可视模式下 aw 选择词及周围空白。\n先按 2、a，输入 hi 后按 Esc，光标后会插入 hihi。"
insert_start = "在本行文字开头插入\n普通模式下跳过缩进再输入，前加数字会在 Esc 时重复输入。块选择时从左侧插入并应用到各行。\n按大写 I，输入 hi 后按 Esc，文字会插在缩进之后、原正文之前。"
append_end = "在行尾插入\n普通模式下在行尾输入，前加数字会在 Esc 时重复输入。块选择时从右侧追加并应用到各行。\n按大写 A，输入 hi 后按 Esc，文字会追加在本行末尾。"
open_below = "下方开行或交换选区端点\n在下方开行后输入，前加数字会在 Esc 时重复开行和输入。可视模式下交换选区端点。\n先按 2、o，输入 hi 后按 Esc，当前行下方会新增两行 hi。"
open_above = "上方开行或切换选区端点\n在上方开行后输入，前加数字会在 Esc 时重复开行和输入。块选择时切换活动角的左右侧。\n先按 2、大写 O，输入 hi 后按 Esc，当前行上方会新增两行 hi。"
delete = "删除光标处的字符\n从光标开始向右删除，数字指定字符数，范围止于行尾。可视模式下删除选中的内容。\n光标在 abcde 的 a 上时，先按 3 再按 x，剩下 de。"
delete_before = "删除光标前的字符\n删除紧挨光标左侧的字符。数字可向左多删几个，范围止于行首。\n光标在 abcde 的 d 上时，先按 2 再按大写 X，剩下 ade。"
substitute_char = "删除字符并开始输入\n普通模式下从光标起删除字符，再输入新内容。前加数字指定删除几个字符，可视模式下修改选区。\n在 bad 开头按 2、s，输入 ok 后按 Esc，bad 变成 okd。"
substitute_line = "修改当前行\n与 cc 一样，保留起始行缩进，替换这一行内容并进入插入模式。数字可指定要修改的行数。\n先按 2、大写 S，输入 ok 后按 Esc，当前行和下一行合为一行 ok，保留起始缩进。"
delete_end = "删除到行尾\n从光标删到本行末尾，并将内容存入寄存器。加次数可将范围延伸到后续行的末尾。\n从光标处删除到下一行的末尾，删除内容存入寄存器。"
change_end = "修改到行尾\n删到本行末尾并开始输入。前加数字可把范围延伸到后续行的行尾，Esc 结束修改。\n从光标处删到下一行的末尾，输入 ok 后按 Esc 完成替换。"
yank_end = "复制到行尾\n把光标到行尾的内容存入寄存器。前加数字可复制到后续行的行尾，之后用 p 或 P 粘贴。\n从光标处复制到下一行的末尾，之后可用 p 粘贴。"
delete_range = "删除移动范围或选区\n普通模式下接移动键或文本对象确定删除范围。前加数字可扩大范围。可视模式下直接删除选区。\n从 red green blue 的开头依次按 2、d、w，删到 blue 前，只剩 blue。"
change_range = "修改移动范围或选区\n接移动键或文本对象，再删除范围并开始输入。前加数字可扩大范围。可视模式下直接修改选区。\n光标在 cat 的任意字母上时，依次按 c、i、w，输入 dog 后按 Esc，整词变成 dog。"
yank_range = "复制移动范围或选区\n接移动键或文本对象指定复制范围，前加数字可扩大范围。也可直接复制可视选区到寄存器。\n从 red green blue 的开头依次按 2、y、w，复制 red green 和 blue 前的空格。"
delete_line = "删除整行\n删除当前整行并存入按行寄存器。前加数字可连同下方的行一起删除，p 可整行粘贴。\n先按 2，再连续按两次 d，删除当前行和下一行。"
change_line = "修改整行\n删除当前行的正文并保留起始缩进，随后输入新内容。数字指定要一起替换的行数。\n连续按两次 c，输入 ok 后按 Esc，当前行的正文变成 ok，缩进保留。"
yank_line = "复制整行\n将当前整行存入按行寄存器。前加数字可复制连续多行，p 会把它们放到当前行下方。\n先按 2，再连续按两次 y，复制当前行和下一行。"
delete_word = "删除到下一词开头\n从光标删到下一词开头。前加数字可删除多词，最后一个词在行尾时，范围止于行尾。\n从 red green blue 的开头依次按 2、d、w，删到 blue 前，只剩 blue。"
change_word = "修改当前词的剩余部分\n光标在词中时，从光标删到词尾再输入。前加数字可修改多个词。用 ciw 可以从词首开始修改。\n从 red green blue 开头按 2、c、w，输入 ok 后按 Esc，得到 ok blue。"
yank_word = "复制到下一词开头\n从光标复制到下一词开头之前，可能包括词后空白。前加数字可扩大范围。用 yiw 复制整个词。\n从 red green blue 的开头依次按 2、y、w，复制 red green 和 blue 前的空格。"
inner_word = "修改光标所在的整个词\n修改光标所在的整个词。前加数字时，词之间的连续空白也单独计数。\n光标在 alpha beta 的 alpha 内时，依次按 2、c、i、w，输入 X 后按 Esc，得到 Xbeta。"
delete_inner_word = "删除光标所在的整个词\n删除光标所在的整个词。前加数字时，词之间的连续空白也单独计数。\n光标在 red blue 的 e 上时，依次按 d、i、w，删掉整个 red，保留后面的空格。"
yank_inner_word = "复制光标所在的整个词\n复制整个词到寄存器。前加数字时，词之间的连续空白也单独计数。\n光标在 red blue 的 e 上时，依次按 y、i、w，复制整个 red 到寄存器。"
paste_after = "向后粘贴寄存器内容\n字符内容放在光标后，整行内容放在当前行下方。可前加数字重复粘贴。\n按两次 y 复制当前行，按 j 下移一行，再按 p 把副本放到该行下方。"
paste_before = "向前粘贴寄存器内容\n字符内容放在光标前，整行内容放在当前行上方。可前加数字重复粘贴。\n按两次 y 复制当前行，按 j 下移一行，再按大写 P 把副本放到该行上方。"
visual = "开始字符选择\n从光标处建立字符选区，再用移动键调整活动端。可用 d、c 或 y 处理选区。\n先按 v，再按 l，选中光标处的字符和右边一个字符。"
visual_line = "开始整行选择\n选中当前整行，随后用 j 或 k 增减选中的行。d、c 或 y 会按行处理。\n先按大写 V，再按 j，选中当前整行和下一整行。"
undo = "撤销修改或将选区转小写\n普通模式下撤销最近一次文本修改，前加数字可撤销多步。可视模式下将选区转为小写。\n完成两次修改后，先按 2 再按 u，依次撤销最近两次修改。"
undo_line = "还原最近编辑过的行\n普通模式下还原该行的原始内容，再按 U 可切回修改后的内容。可视模式下将选区转为大写。\n先按 x 删除一个字符，再按大写 U，还原这一行。"
join = "合并当前行和下一行\n去掉换行及后续行的缩进，必要时补一个空格。数字指定总行数，至少合并两行。\n先按 3，再按大写 J，把当前行与下面两行合并成一行。"
search = "向前搜索\n输入模式并按 Enter，跳到光标后的匹配。前加数字指定第几处匹配，n 继续向前查找。\n先按 2、/，输入 word 后按 Enter，跳到光标后的第 2 处匹配。"
search_back = "向后搜索\n输入模式并按 Enter，跳到光标前的匹配。前加数字指定第几处匹配，n 继续向后查找。\n先按 2、?，输入 word 后按 Enter，跳到光标前的第 2 处匹配。"
search_repeat = "按原方向重复搜索\n沿上次的方向查找相同模式。前加数字可跳到该方向的第几处匹配。\n完成一次搜索后，先按 2 再按 n，沿原方向跳到第 2 处匹配。"
search_reverse = "反向重复搜索\n用上次的模式反向查找。前加数字可跳到反方向的第几处匹配。\n向前搜索后，先按 2 再按大写 N，反向跳到光标前的第 2 处匹配。"
command = "打开编辑器命令行\n在底部输入 Ex 命令，按 Enter 执行。可用 :w 保存，:e 文件名打开文件，也可执行替换。\n按 : 打开命令行，输入 %s/old/new/g 后按 Enter，把全文的 old 替换为 new。"
repeat_change = "重复上一次文本修改\n在当前光标处重做最近的修改。若前加数字，会用该数字替换上次修改的次数。\n按 x 删一个字符，再按 2、.，从当前位置继续删两个字符。"
record = "录制或停止录制宏\n按 q 后接字母选择寄存器，随后执行要录制的操作。再次按 q 停止，用 @ 加字母回放。\n按 q、a 开始录制，按 x 删一个字符，再按 q 停止，操作存入寄存器 a。"
play = "回放寄存器中的宏\n按 @ 后接录制时使用的字母。数字指定回放次数，@@ 重复执行最近回放的宏。\n寄存器 a 中已有宏时，依次按 2、@、a，在当前位置回放两次。"
play_last = "回放最近录制的宏\n直接执行最后一次录制完成的宏，无需再输入寄存器字母。数字可重复回放。\n录好一个宏后，先按 2 再按大写 Q，回放最近录制的宏两次。"
mark = "在光标处设置标记\n按 m 后接一个字母，把当前光标位置记到该标记。随后可用单引号或反引号跳回。\n先按 m，再按 a，将当前光标的行和列记为标记 a。"
mark_line = "跳到标记所在行\n按单引号再输入标记字母，跳到该行第一个非空白字符。可用 ma 先建立标记 a。\n用 ma 设好标记 a 后，按单引号再按 a，跳到标记所在行的第一个非空白字符。"
mark_exact = "跳到标记的精确位置\n按反引号再输入标记字母，跳到标记保存的行和列。需要回到原字符时可用这一键。\n用 ma 设好标记 a 后，按反引号再按 a，回到该标记保存的行和列。"
replace = "用下一字符替换\n按 r 后输入替换字符，完成后留在普通模式。前加数字可替换多个字符，可视模式下替换选区。\n在 abcde 开头依次按 2、r、x，前两个字符都换成 x，得到 xxcde。"
replace_mode = "进入替换模式\n从光标处覆盖后面的字符，行尾可继续追加。前加数字会在 Esc 时重复本次替换输入。\n在 abcd 开头按大写 R，输入 xy 后按 Esc，得到 xycd。"
find = "在本行向右查找字符\n按 f 后输入目标字符，光标落在匹配字符上。数字指定第几次出现，分号可重复查找。\n依次按 2、f、a，停在本行光标右侧第 2 个 a 上。"
find_left = "在本行向左查找字符\n按 F 后输入目标字符，向左查找并停在匹配字符上。数字可跳到更前面的匹配。\n依次按 2、大写 F、a，停在本行光标左侧第 2 个 a 上。"
till = "向右移到目标之前\n按 t 后输入字符，停在目标左边。前加数字可选第几处匹配。配合 d 或 c 可保留目标。\n依次按 2、t、逗号，停在本行光标右侧第 2 个逗号的前一个字符。"
till_left = "向左移到目标之后\n按 T 后输入字符，在本行向左找到它并停在它右边。可前加数字指定第几处匹配。\n依次按 2、大写 T、逗号，停在本行光标左侧第 2 个逗号的后一个字符。"
find_repeat = "重复本行字符查找\n沿上一次 f、F、t 或 T 的方向继续查找。前加数字可选第几处匹配，停靠方式保持相同。\n用 fa 找到右侧第一个 a，再按 2、分号，从该处继续向右找第 2 个 a。"
find_reverse = "反方向查找字符\n用上一次 f、F、t 或 T 的字符在本行反向查找。前加数字可选反方向的第几处匹配。\n光标在 aXa 的 X 上时，fa 跳到右边的 a，再按逗号跳到左边的 a。"
match_pair = "跳到配对括号或百分比行\n查找本行光标处或其右侧的括号并跳到配对端。前加 1 到 100 的数字则按文件行数百分比跳转。\n依次按 5、0、%，跳到文件总行数的 50% 处。"
word_search = "向前搜索光标处的词\n把光标处的词作为整词搜索目标，向前找匹配。前加数字可选第几处匹配，再用 n 继续搜索。\n光标在 cat 中时，先按 2 再按 *，找光标后第 2 个完整的 cat。"
word_search_back = "向后搜索光标处的词\n把光标处的词作为整词搜索目标，向后找匹配。前加数字可选第几处匹配，再用 n 继续向后。\n光标在 cat 中时，先按 2 再按 #，找光标前第 2 个完整的 cat。"
sentence_prev = "跳到上一句开头\n依据句末标点和空白定位句子开头，向后跳转。数字指定跨过几句。\n光标在句子中间时，按 ( 跳回这句话的开头。"
sentence_next = "跳到下一句开头\n依据句末标点和空白定位下一句，跳到它的开头。数字指定跨过几句。\n光标在句子中间时，按 ) 跳到下一句的开头。"
paragraph_prev = "跳到上一段边界\n向前文查找以空行分隔的段落边界。前加数字可跨过多段。\n光标在段落中间时，按左花括号跳到段落前的空行。"
paragraph_next = "跳到下一段边界\n向后文查找以空行分隔的段落边界。前加数字可跨过多段。\n光标在段落中间时，按右花括号跳到段落后的空行。"
outdent = "减少指定行的缩进\n接移动键确定范围，或用 << 操作本行。前加数字可对多行减少一级缩进，可视模式下直接处理选区。\n先按 2，再按两次 <，把当前行和下一行各减少一级缩进。"
indent = "增加指定行的缩进\n接移动键确定范围，或用 >> 操作本行。前加数字可对多行增加一级缩进，可视模式下直接处理选区。\n先按 2，再按两次 >，把当前行和下一行各增加一级缩进。"
reindent = "重新计算指定行的缩进\n参考附近的缩进和括号重排行首空白。接移动键或文本对象确定范围，也可用 2== 重排两行。\n依次按 =、i、p，按附近代码结构重新计算当前段落各行的缩进。"
line_up = "跳到上一行的文字开头\n向上移动一行并跳过缩进，停在目标行第一个非空白字符。数字指定向上的行数。\n先按 2 再按 -，跳到上方第 2 行的第一个非空白字符。"
line_down = "跳到下一行的文字开头\n向下移动一行并跳过缩进，停在目标行第一个非空白字符。数字指定向下的行数。\n先按 2 再按 +，跳到下方第 2 行的第一个非空白字符。"
line_count = "跳到当前或相对行的文字开头\n直接按 _ 跳过当前行缩进。计数从当前行算作第 1 行，因此 3_ 跳到下方第 2 行的正文开头。\n先按 3 再按 _。从当前行开始数，跳到下方第 2 行的正文开头。"
column = "跳到本行指定显示列\n数字按从 1 开始的显示列计算，包括制表符和宽字符所占的列。直接按该键会回到第一列。\n依次按 1、2、|，跳到当前行的第 12 个显示列。"
toggle_case = "切换字符大小写\n从光标处切换字符大小写并向右移。前加数字指定处理多少个字符，可视模式下处理整个选区。\n在 aBc 开头先按 3 再按 ~，三个字母依次切换大小写，得到 AbC。"
repeat_substitution = "重复上一次替换\n在当前行重用最近一次 :s 的搜索模式、替换文本和标志。先把光标移到要再次替换的行。\n先在本行把 old 换成 new。按 j 到下一行，再按 & 重做相同替换。"
shell_filter = "用外部命令处理选定行\n接移动键选行，或用 !! 处理当前行。前加数字可处理多行。输入命令并按 Enter，用其输出替换原文。\n依次按 2、!、!，输入 sort 后按 Enter，把当前行和下一行排序。"
register = "为下一次编辑选择寄存器\n按双引号再输入寄存器名，然后执行复制、删除或粘贴。可用 a 等字母保存多份文本。\n按双引号，再按 a、y、y，将当前整行复制到寄存器 a。"
bracket_left = "开始向后的方括号命令\n接 m 向前文查找方法或代码块边界。前加数字可跨过多处边界。\n在方法体内按 [ 再按 m，向前查找方法或代码块的边界。"
bracket_right = "开始向前的方括号命令\n接 m 向后文查找方法或代码块边界。前加数字可跨过多处边界。\n在方法体内按 ] 再按 m，向后查找方法或代码块的边界。"
method_prev = "跳到前一个方法或代码块\n按花括号嵌套向前文查找方法开头或外层代码块。前加数字可跨过多处边界。\n依次按 2、[、m，向前查找方法或代码块的边界，停在第 2 处。"
method_next = "跳到后一个方法或代码块\n按花括号嵌套向后文查找方法开头或外层代码块。前加数字可跨过多处边界。\n依次按 2、]、m，向后查找方法或代码块的边界，停在第 2 处。"
z_prefix = "折叠、滚动、检查拼写或操作寄存器\n按 z 查看后续按键。用 zf 折叠文本，用 z= 检查拼写。\n连续按两次 z，将光标所在行滚到中间。"
view_center = "将当前行居中显示\n滚动视口，让光标所在行靠近中间。前加行号时，先把光标移到指定行再居中。\n依次按 1、2、z、z，跳到第 12 行并在视口中居中显示。"
view_top = "将当前行移到视口上方\n滚动视口，把光标所在行放到上方留白之后。前加行号时定位到该行。\n依次按 1、2、z、t，跳到第 12 行并把它放到视口上方。"
view_bottom = "将当前行移到视口下方\n滚动视口，把光标所在行放到下方留白之前。前加行号时定位到该行。\n依次按 1、2、z、b，跳到第 12 行并把它放到视口下方。"
leader = "开始 Nanobug 前导键命令\n在普通模式按反斜杠或 Space，稍停可看到按键序列提示。\n退出帮助后，先按反斜杠或 Space，再按 ? 可重新打开。"
big_word_prev = "按空白分隔向后跳词\n按连续非空白字符分组，标点也算在组内。向后找开头，前加数字可跳过多组。\n从 foo-bar baz.qux end 的 end 开头出发，按 2、大写 B，跳到 foo-bar 开头。"
big_word_next = "按空白分隔向前跳词\n跳过当前这一段非空白字符，再跳过间隔，停在下一段开头。数字可重复移动。\n从 foo-bar baz.qux end 的开头出发，按 2、大写 W，跳到 end 开头。"
big_word_end = "按空白分隔跳到词尾\n跳到一段连续非空白字符的末尾，包括标点。已在末尾时去下一段，前加数字可继续跨段。\n从 foo-bar baz.qux 的开头出发，按 2、大写 E，停在 baz.qux 末尾的 x 上。"
screen_top = "跳到视口上方\n把光标移到当前可见区域的上方，保留可用的滚动留白。数字可向视口内部偏移。\n先按 5，再按大写 H，目标是视口从上往下数的第 5 行，受滚动留白约束。"
screen_middle = "跳到视口中间行\n把光标移到当前屏幕可见行的中间。只移动光标，参考的是视口内的行。\n按大写 M，光标移到当前视口中间的可见行。"
screen_bottom = "跳到视口下方\n把光标移到当前可见区域的下方，保留可用的滚动留白。数字可向视口内部偏移。\n先按 5，再按大写 L，目标是视口从下往上数的第 5 行，受滚动留白约束。"
z_capital = "选择退出方式\n第二键按 Z 会先保存当前文件再退出，第二键按 Q 会放弃未保存的修改并退出。\n连续按两次大写 Z，保存当前文件并请求退出。"
save_exit = "保存当前文件并退出\n当前文件有修改时先保存，然后请求退出。其他有未保存内容的文件仍按退出流程处理。\n连续按两次大写 Z，保存当前文件的修改并请求退出。"
discard_exit = "放弃未保存的修改并退出\n直接退出 Nanobug。当前窗口中尚未保存到磁盘的修改会被丢弃。\n先按大写 Z，再按大写 Q，退出并丢弃未保存的修改。"
save = "保存当前文件\n将编辑区的当前文档写回文件。也可以用 :w 保存，或用 :w 文件名另存。\n按住 Ctrl 再按 s，将当前文档写回磁盘。"
redo = "重做或插入寄存器内容\n普通模式下重做撤销的修改，前加数字可重做多步。输入文字时，接寄存器名插入其中的文本。\n撤销两次后，先按 2，再按住 Ctrl 按 r，恢复这两次修改。"
control_w = "删除光标前的词\n插入模式下删除前一词并单独记为一次撤销。搜索和命令行中也可删除输入光标前的词。\n在空行按 i 后输入 red blue，按住 Ctrl 按 w 删除 blue，再按 Esc 退出插入。"
control_u = "向上翻半页或清除输入\n普通模式下上翻半页，前加数字设置后续半页行数。插入模式清除本次输入，搜索和命令行清除光标前内容。\n先按 5，再按住 Ctrl 按 u，上移五行，后续半页滚动也以五行为单位。"
half_down = "向下翻半页\n视口和光标一起向下移动。前加数字可设定半页行数，后续 Ctrl+u 或 Ctrl+d 沿用。\n先按 5，再按住 Ctrl 按 d，下移五行，后续半页滚动也以五行为单位。"
block = "开始矩形选择或粘贴剪贴板\n普通模式下按行与显示列选取矩形，再用移动键扩大。在 Nanobug 的文本输入区粘贴系统剪贴板。\n按住 Ctrl 按 v，再松开 Ctrl 依次按 j、l，选中两行两列的矩形。"
normal = "返回普通模式\n与 Esc 同效。结束插入、替换、选择或命令输入，取消当前待完成的命令。\n按 i 输入 hi，按住 Ctrl 再按 [，完成插入并回到普通模式。"
pane_left = "聚焦左侧窗格或查看区域快捷键\n普通模式下切到左侧文件管理器。快捷键弹窗中切回当前区域，插入模式下相当于退格。\n在编辑区普通模式下，按住 Ctrl 按 h，焦点切到左侧文件管理器。"
pane_right = "聚焦右侧窗格或查看全局快捷键\n从文件管理器切到右侧编辑区，必要时恢复该窗格。快捷键弹窗中切到全局快捷键。\n在快捷键弹层中，按住 Ctrl 按 l，切到全局快捷键面板。"
pane_down = "聚焦下方窗格\n普通模式下用于切到下方窗格，当前布局没有目标时保留焦点。插入模式下可换行。\n先按 i，按住 Ctrl 按 j 在光标处换行，再按 Esc 回到普通模式。"
pane_up = "聚焦上方窗格\n普通模式下用于切到上方窗格。当前左右布局没有上方窗格时，焦点留在原处。\n在普通模式下按住 Ctrl 按 k。当前为左右分栏时，焦点留在原窗格。"
increment = "增加光标处或之后的数字\n查找本行光标处或其右侧的第一个数字。默认加 1，前加次数可改变量。\n光标在十进制数字 7 上时，先按 3，再按住 Ctrl 按 a，7 变成 10。"
decrement = "减小光标处或之后的数字\n查找本行光标处或其右侧的第一个数字。默认减 1，前加次数可改变量。\n光标在十进制数字 7 上时，先按 3，再按住 Ctrl 按 x，7 变成 4。"
page_up = "向上翻一整页\n普通模式下向上翻一页，相邻两页保留两行重叠。前加数字可翻多页。\n先按 2，再按住 Ctrl 按 b，向上翻两页，每次翻页保留两行重叠。"
page_down = "向下翻一整页\n普通模式下向下翻一页，相邻两页保留两行重叠。前加数字可翻多页。\n先按 2，再按住 Ctrl 按 f，向下翻两页，每次翻页保留两行重叠。"
scroll_down = "向下滚动视口\n默认向下滚动一行，数字可指定行数。光标尽量留在原处，必要时移到滚动留白以内。\n先按 2，再按住 Ctrl 按 e，向下滚动视口，在底部露出两行。"
scroll_up = "向上滚动视口\n默认向上滚动一行，数字可指定行数。光标尽量留在原处，必要时移到滚动留白以内。\n先按 2，再按住 Ctrl 按 y，向上滚动视口，在顶部露出两行。"
jump_back = "返回较早的跳转位置\n沿跳转记录返回，例如从搜索结果或指定行跳回之前的位置。数字可后退多个记录。\n按大写 G 跳到末行，再按住 Ctrl 按 o，回到跳转前的位置。"
jump_forward = "前进到较新的跳转位置\n用 Ctrl+o 后退后，沿跳转记录向前。数字可前进多个记录。\n按大写 G 跳到末行，再按 Ctrl+o 返回。接着按 Ctrl+i 回到末行的跳转位置。"

