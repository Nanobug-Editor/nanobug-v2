insert_key = "进入插入模式或切换插入与替换\n普通模式下在光标处开始插入。在插入或替换模式下，按 Ins 在两者之间切换。\n光标在 cat 开头时，按 Ins 输入 X，再按 Ins 输入 Y，最后按 Esc，得到 XYat。"
