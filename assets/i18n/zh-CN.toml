next_tab = "切到下一个标签\n切换到右侧标签，各标签分别保留自己的文档和光标位置。\n有两个标签时，在第一个标签上按住 Alt，再按 j 或 l，会选中第二个标签。"
move_tab_left = "向左移动当前标签\n把当前标签往左移动一位，并继续选中它。\n选中第二个标签后，按住 Ctrl 和 Alt，再按 h 或 k，把它移到第一位。"
move_tab_right = "向右移动当前标签\n把当前标签往右移动一位，并继续选中它。\n选中第一个标签后，按住 Ctrl 和 Alt，再按 j 或 l，把它移到第二位。"
tab_to_first = "把当前标签移到最前\n将当前选中的标签移动到标签栏的第一位。\n按住 Ctrl 和 Alt，再按 Home，把当前标签移到最前。"
tab_to_last = "把当前标签移到最后\n将当前选中的标签移动到标签栏的最后一位。\n按住 Ctrl 和 Alt，再按 End，把当前标签移到最后。"
close_editor = "关闭编辑区\n关闭编辑区窗格或对应的独立标签。有未保存的修改时会先确认。\n文件管理器可见时，按住 Alt 再按 Esc，关闭编辑区并聚焦文件管理器。"
escape = "关闭快捷键窗口\n关闭弹层并回到打开它的窗格。\n弹层打开时按 Esc，回到原来的窗格。"
refresh = "刷新文件管理器\n重新扫描当前项目目录，更新文件管理器中的条目。\n在项目目录新增文件后按 F5，新文件会出现在文件管理器中。"
cycle_cursor = "切换到下一个光标动效\n按顺序切换光标动画预设。\n在编辑区按 F6，切换到下一个光标动效。"
cycle_cursor_back = "切换到上一个光标动效\n按反方向切换光标动画预设。\n按住 Shift 再按 F6，切换到上一个光标动效。"
reload_cursor = "重新加载光标配置\n读取当前项目的光标配置，状态栏会显示加载结果。\n保存光标配置后按 F7，在当前项目中应用配置。"
delete_key = "删除光标处的字符\n普通模式删除光标下的字符，插入模式删除输入光标后的字符。\n普通模式下，把光标移到 cat 的 c 上再按 Delete，剩下 at。"
